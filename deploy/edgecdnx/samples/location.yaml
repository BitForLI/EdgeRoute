apiVersion: infrastructure.edgecdnx.com/v1alpha1
kind: Location
metadata:
  name: lab-global
  namespace: edge-system
  labels:
    app.kubernetes.io/part-of: edgeroute
spec:
  geoLookup:
    weight: 0
    attributes: {}
---
apiVersion: infrastructure.edgecdnx.com/v1alpha1
kind: Location
metadata:
  name: sydney
  namespace: edge-system
  labels:
    app.kubernetes.io/part-of: edgeroute
spec:
  parent: lab-global
  geoLookup:
    weight: 50
    attributes:
      geoip/continent/code:
        weight: 1000
        values:
          - value: OC
  nodeGroups:
    - name: hls
      flavor: nginx
      nodes:
        - name: edge-sydney
          ipv4: 10.96.10.11
      nodeSelector:
        edge-role: sydney
      cacheConfig:
        name: hls
        path: /var/cache/nginx
        keysZone: 32m
        inactive: 10m
        maxSize: 256m
---
